# Model profiles. agents.json for OpenMinion is generated from this file.
provider = "anthropic"
key_env = "ANTHROPIC_API_KEY"   # model key, read from the environment only
agents_json = "state/agents.json"
max_concurrency = 4          # subagents running at once, one per changed thread, each on its own runtime (ADR 0010)

[profiles.reader]
model = "claude-haiku-5-5"   # reads one thread, returns ThreadState
timeout_s = 240              # one reader turn; OpenMinion's own default (90 s) is too short on a busy host

[profiles.drafter]
model = "claude-sonnet-5-5"  # writes one follow-up draft
max_words = 120

# Fallback order when the built-in provider adapter fails. Each switch is recorded as a decision.
[[fallback]]
provider = "custom-anthropic-compatible"
base_url = "https://api.anthropic.com"
key_env = "ANTHROPIC_API_KEY"

[[fallback]]
provider = "custom-openai-compatible"
base_url = "https://router.huggingface.co/v1"
key_env = "HF_TOKEN"
model_match = "Qwen3"        # first tool-capable model whose id contains this
