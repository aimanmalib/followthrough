# Public demo site: a landing page in English (/) and Malay (/ms/) plus the offline fixture sweep (synthetic sample
# repository, rule reader, fixed clock) rendered as digest.html at /digest/ and /ms/digest/, assembled by
# scripts/build_pages.py (ADR 0016, ADR 0017). No secrets, no network beyond the install.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv sync --frozen
      - name: Render the fixture digest in both languages
        run: |
          set -euo pipefail
          for lang in en ms; do
            uv run --frozen followthrough sweep --fixture --lang "$lang" --out "runs/$lang" >/dev/null
          done
          uv run --frozen python scripts/build_pages.py runs _site
          test "$(find _site -name index.html | wc -l)" = 4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
