version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned exactly: every finding in BUILDING_BLOCKS.md is stated for this version. It is upgraded once, by hand,
      # with the tests and measurements run again (RELEASE.md), not by an automatic pull request during judging.
      - dependency-name: "openminion"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
