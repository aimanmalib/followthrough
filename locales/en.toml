[landing.faq]
# Numbered pairs: q1 + a1, q2 + a2, … shown in number order. Answers repeat facts from the README and the test results.
q1 = "Does it ever post a comment on its own?"
a1 = "No. The one write path checks a stop file first, then an allow-list, then asks a person to answer allow_once or deny. No answer means no post. The shipped allow-list holds only the project's own sandbox repository."
q2 = "What does it read, and how?"
a2 = "Public GitHub data, with GET requests only. It reads the issue threads that changed since the last sweep and the repository's CONTRIBUTING follow-up rules."
q3 = "How does it avoid made-up dates?"
a3 = "Every date the model relies on comes with a quote. The quote must appear word for word in one real comment, and the date must be that comment's own time. Otherwise the reading is rejected, the thread is marked unclear, and the rejection is counted."
q4 = "Will it remind the same thread twice?"
a4 = "Not while nothing changes. A ledger keyed on each thread's state (update time, comment count, labels) holds back a second draft until something changes or the entry expires."
q5 = "What does a sweep cost?"
a5 = "Spend is capped at USD 1.00 per sweep and USD 20.00 in total, set in config/budget.toml; a sweep that would cross either stops with a message. The sample on this page was made from saved readings, with no model at all."
q6 = "How well does it match a repository's own labels?"
a6 = "Not well yet. Agreement with OpenMinion's status labels was 0.171 and 0.204 after the quote check in two test runs, against a target of 0.80, and no live sweep read every open thread within 20 minutes. Both are listed in the test results."
q7 = "Is this an official OpenMinion or Cortensor project?"
a7 = "No. It is an unofficial entry to Cortensor Hackathon #5, not affiliated with, endorsed by, or supported by the OpenMinion or Cortensor teams."
