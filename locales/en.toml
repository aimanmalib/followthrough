[cli]
description = "Follow-Through: who is waiting on whom in your issues and pull requests."
version = "followthrough {version}"
lang_help = "Output language (en or ms)."
sweep_help = "Read every open thread, apply the follow-up rules and print the digest."
fixture_help = "Sweep a saved snapshot instead of GitHub (default: the synthetic fixture in config/policy.toml)."
live_help = "Read the repository from GitHub (GET requests only; token from the environment)."
repo_help = "Repository to sweep with --live, as owner/name."
now_help = "Clock for the rules, ISO 8601 with time zone (default: the fixture's own time, or now)."
reader_help = "Who reads the threads: 'states' (saved readings, offline) or 'model' (one agent per thread)."
draft_help = "Also draft follow-ups (model), skipping threads the reminder ledger has already covered."
states_help = "Saved readings for --reader states (default: the fixture's hand-written readings)."
out_help = "Folder for digest files (default: out/); a dated subfolder is created."
format_help = "What to print: the Markdown digest (md) or the JSON digest (json)."
repo_required = "--live needs --repo owner/name."
states_live = "--reader states only works with --fixture; a live sweep is read by the model."
key_missing = "The model reader needs {env} in the environment."
written = "Digest written to {folder}"
doctor_help = "Check the OpenMinion setup: the project config, then one turn with the key-free echo provider."
schedule_help = "Prove a daily OpenMinion schedule (create, one run, pause, delete) and print the system cron line."
daily_help = "Time of the daily sweep, 24-hour UTC, as HH:MM."
post_help = "Show one saved draft, ask allow_once or deny on standard input, and post it only if allowed."
post_repo_help = "Repository of the thread, as owner/name (must be in config/safety.toml allow_post_repos)."
post_number_help = "Issue or pull request number."
post_draft_help = "The saved draft file (out/<date>/drafts/<number>.md); its text is posted exactly."

[digest]
title = "Follow-Through digest: {repo}"
as_of = "As of {as_of}, {threads} open threads read."
partial = "Partial digest: {reason}"
col_action = "Action"
col_threads = "Threads"
guard_note = "Readings rejected by the quote check: {rejected}. Threads that could not be read: {failed}."

[errors]
config_missing_file = "Config file not found: {path}"
config_missing_key = "Config key missing: {file} -> {key}"
locale_unknown = "Unknown language: {lang}"

[github]
write_refused = "Refused: the GitHub reader only sends GET requests (got {method})."
rate_limited = "GitHub rate limit reached; try again after {reset}."
http_error = "GitHub returned HTTP {status} for {path}."
too_many_pages = "Stopped after {pages} pages for {path}."

[actions]
FOLLOW_UP_DUE = "Follow-up due"
TAKEOVER_ALLOWED = "Take-over allowed"
MAINTAINER_REPLY_PENDING = "Maintainer reply pending"
READY_TO_VERIFY = "Ready to verify"
NO_ACTION = "No action"

[reasons]
request_unanswered = "maintainer request unanswered since {requested_on}"
eta_passed = "agreed date {agreed_eta} has passed without an update"
follow_up_unanswered = "follow-up sent {followed_up_on}; take-over allowed from {takeover_from}"
follow_up_sent = "follow-up sent {followed_up_on}; waiting until {takeover_from}"
within_window = "still inside the agreed window"
contributor_waiting = "contributor asked on {asked_on}; reply expected by {reply_due}"
fix_released = "fix shipped in {release_tag} on {released_on}"
unclear = "could not verify the reading of this thread"
nothing_pending = "nobody is overdue"
read_failed = "the thread could not be read"

[budget]
unpriced_model = "No price for model {model} in config/prices.toml; refusing to run it."
sweep_limit = "Stopped: the next model turn could pass the per-sweep limit of USD {limit} (spent USD {spent})."
total_limit = "Stopped: the next model turn could pass the total limit of USD {limit} (spent USD {spent})."

[reader]
invalid_output = "the model reply was not a valid thread state"
provider_error = "the model provider failed"

[ops]
doctor_project_config = "Project config: {status} (provider {provider}; ok {ok}, warn {warn}, fail {fail})"
doctor_turn_check = "Turn check, echo provider: {status} (ok {ok}, warn {warn}, fail {fail})"
saved = "Saved {path}"
bad_daily = "--daily needs a 24-hour UTC time as HH:MM (got {value})."
schedule_result = "Scheduling proof: cron \"{cron}\" ({tz}), proof run {state}, passed: {ok}"
cron_line = "For a daily sweep, add this line to your own crontab (Follow-Through does not install it):"

[post]
review = "Review the comment for {repo}#{number}; this exact text will be posted:"
ask = "Type {allow} to post it once, or {deny} to drop it:"
empty = "The draft {path} is empty; nothing to post."
stopped = "Stop file present: nothing was posted."
status_posted = "Posted on {repo}#{number}: {url} ({posts} write request)"
status_denied = "Denied: nothing posted on {repo}#{number} ({posts} write requests)."
status_refused_repo = "{repo} is not in allow_post_repos: nothing posted ({posts} write requests)."
status_paused = "No approver: paused, nothing posted on {repo}#{number}."
status_not_posted = "Not posted on {repo}#{number} ({posts} write requests)."
status_error = "The post step failed; nothing confirmed on {repo}#{number} ({posts} write requests)."
