[landing.how_steps.1]
title = "Read the changed threads"
text = "One OpenMinion subagent per changed issue thread works out who is waiting on whom: the maintainer, the contributor, a release, nobody, or unclear."
sample = "6 open threads read"

[landing.how_steps.2]
title = "Check every quote"
text = "Each date the model relies on must come with a quote that appears word for word in a real comment, dated at that comment's own time. Otherwise the reading is rejected and counted."
sample = "Quote check: 0 of 6 rejected"

[landing.how_steps.3]
title = "Apply your rules"
text = "Deterministic rules with a clock you can set turn the readings into five actions: follow-up due, take-over allowed, maintainer reply pending, ready to verify, no action."
sample = "#101 Follow-up due, maintainer request unanswered since 2026-11-02"

[landing.how_steps.4]
title = "Draft, then ask a person"
text = "A draft of up to 120 words cites the CONTRIBUTING step and every computed date. Nothing is posted until a person answers allow_once, and a ledger holds back a second reminder until the thread changes."
sample = "allow_once or deny"

