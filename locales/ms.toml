[landing.faq]
# Numbered pairs: q1 + a1, q2 + a2, … shown in number order. Answers repeat facts from the README and the test results.
q1 = "Adakah ia pernah mengepos komen sendiri?"
a1 = "Tidak. Satu-satunya laluan tulis menyemak fail henti dahulu, kemudian senarai benar, kemudian meminta manusia menjawab allow_once atau deny. Tiada jawapan bermakna tiada pos. Senarai benar yang disertakan hanya memegang repositori kotak pasir projek ini sendiri."
q2 = "Apa yang dibacanya, dan bagaimana?"
a2 = "Data GitHub awam, dengan permintaan GET sahaja. Ia membaca benang isu yang berubah sejak sapuan lepas dan peraturan susulan CONTRIBUTING repositori itu."
q3 = "Bagaimana ia mengelak tarikh rekaan?"
a3 = "Setiap tarikh yang dipakai model datang bersama petikan. Petikan itu mesti wujud kata demi kata dalam satu komen sebenar, dan tarikh itu mesti masa komen tersebut. Jika tidak, bacaan ditolak, benang ditanda tidak jelas, dan penolakan dikira."
q4 = "Adakah ia mengingatkan benang yang sama dua kali?"
a4 = "Tidak selagi tiada perubahan. Lejar yang dikunci pada keadaan setiap benang (masa kemas kini, bilangan komen, label) menahan draf kedua sehingga sesuatu berubah atau entri itu tamat tempoh."
q5 = "Berapa kos satu sapuan?"
a5 = "Perbelanjaan dihadkan pada USD 1.00 setiap sapuan dan USD 20.00 keseluruhan, ditetapkan dalam config/budget.toml; sapuan yang akan melepasi mana-mana had berhenti dengan mesej. Contoh di halaman ini dibuat daripada bacaan tersimpan, tanpa model langsung."
q6 = "Sejauh mana ia sepadan dengan label repositori itu sendiri?"
a6 = "Belum baik. Persetujuan dengan label status OpenMinion ialah 0.171 dan 0.204 selepas semakan petikan dalam dua larian ujian, berbanding sasaran 0.80, dan tiada sapuan langsung membaca setiap benang terbuka dalam 20 minit. Kedua-duanya disenaraikan dalam keputusan ujian."
q7 = "Adakah ini projek rasmi OpenMinion atau Cortensor?"
a7 = "Tidak. Ia penyertaan tidak rasmi untuk Cortensor Hackathon #5, tiada kaitan dengan, tidak disokong dan tidak diiktiraf oleh pasukan OpenMinion atau Cortensor."
