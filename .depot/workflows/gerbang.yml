# CI gate for followthrough on Depot (workflow_dispatch only). Runs scripts/gerbang-ujian.sh: uv sync --frozen + offline pytest.
# No secrets: every value the tests need is synthetic. NO_COLOR because the runner forces colour.
name: gerbang
on: workflow_dispatch
jobs:
  gerbang:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    env:
      NO_COLOR: "1"
      CI: "1"
      TERM: dumb
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv sync --frozen
      - run: uv run --frozen playwright install --with-deps chromium webkit || true
      - run: bash scripts/gerbang-ujian.sh
